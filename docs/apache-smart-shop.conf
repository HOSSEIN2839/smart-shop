# نمونه تنظیم Apache برای سرور بدون دامنه (دسترسی با IP سرور)
# مسیر: /etc/apache2/sites-available/smart-shop.conf
# فعال‌سازی: a2dissite 000-default ; a2ensite smart-shop ; apache2ctl configtest ; systemctl reload apache2
<VirtualHost *:80>
    # ServerName نداریم؛ این سایت پیش‌فرض است و با http://IP-سرور باز می‌شود.
    DocumentRoot /var/www/smart-shop/public

    <Directory /var/www/smart-shop/public>
        AllowOverride All
        Require all granted
    </Directory>

    # فقط public از اینترنت دیده می‌شود؛ app، config، prompts، database، scripts و logs بیرون از آن‌اند.
    ServerSignature Off
    ErrorLog ${APACHE_LOG_DIR}/smart-shop-error.log
    CustomLog ${APACHE_LOG_DIR}/smart-shop-access.log combined
</VirtualHost>

# نکته: برای کم کردن اطلاعات نسخه، در /etc/apache2/conf-available/security.conf این دو خط را بگذارید:
#   ServerTokens Prod
#   ServerSignature Off
